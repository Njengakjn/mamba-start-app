services:
  postgres:
    image: 'postgres:14.2'
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mamba
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/

  redis:
    image: 'redis:alpine'
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - ./db-data/redis/:/data
  
  mariadb:
    image: 'mariadb:10'
    ports:
      - '3306:3306'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mamba
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: password
    
    volumes:
      - ./db-data/mariadb:/docker-entrypoint-initdb.d